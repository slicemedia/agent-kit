interface:
  display_name: "Build Webflow Motion"
  short_description: "Build custom Webflow motion with GSAP addons"
  default_prompt: "Use $build-webflow-motion to implement this custom animation as a GSAP addon by default, honor my chosen animation approach, and keep Webflow markup and base styles editable. Consider CSS or native Interactions for clearly suitable simple effects."

dependencies:
  tools:
    - type: "mcp"
      value: "webflow"
      description: "Official Webflow MCP server"
      transport: "streamable_http"
      url: "https://mcp.webflow.com/mcp"
