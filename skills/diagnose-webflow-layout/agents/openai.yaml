interface:
  display_name: "Diagnose Webflow Layout"
  short_description: "Find and fix native Webflow layout issues"
  default_prompt: "Use $diagnose-webflow-layout to diagnose this responsive Webflow layout and propose the narrowest native fix."

dependencies:
  tools:
